name: prospect-crm-qa

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: prospect-crm-qa-app:latest
    env_file:
      - .env.qa
    environment:
      IMPORT_TEMP_DIRECTORY: /app/.runtime/imports
      WORKER_DATABASE_URL: ""
      POSTGRES_WORKER_PASSWORD: ""
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - prospect-qa-import-temp:/app/.runtime/imports
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  migrations:
    image: prospect-crm-qa-app:latest
    profiles: ["tools"]
    env_file:
      - .env.qa
    depends_on:
      postgresql:
        condition: service_healthy
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]

  worker:
    image: prospect-crm-qa-app:latest
    command: ["python", "-m", "backend.app.cli.worker", "run"]
    environment:
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL is required}
      JOB_IDEMPOTENCY_HMAC_KEY: ${JOB_IDEMPOTENCY_HMAC_KEY:?JOB_IDEMPOTENCY_HMAC_KEY is required}
      IMPORT_TEMP_DIRECTORY: /app/.runtime/imports
      JOB_QUEUE_LAG_ALERT_SECONDS: ${JOB_QUEUE_LAG_ALERT_SECONDS:-300}
      JOB_CLEANUP_ALERT_SECONDS: ${JOB_CLEANUP_ALERT_SECONDS:-1800}
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.cli.worker", "health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    volumes:
      - prospect-qa-import-temp:/app/.runtime/imports

  postgresql:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospect}
      POSTGRES_USER: ${POSTGRES_USER:-prospect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - prospect-qa-postgresql-data:/var/lib/postgresql/data

  database-role-provisioner:
    image: postgres:17.10-alpine
    profiles: ["tools"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prospect}
      POSTGRES_USER: ${POSTGRES_USER:-prospect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: prospect_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}
    volumes:
      - ./backend/database/provision-postgres-roles.sh:/provision-postgres-roles.sh:ro
    command: ["sh", "/provision-postgres-roles.sh"]

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - prospect-qa-redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.30.5
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    volumes:
      - prospect-qa-mailpit-data:/data

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      QA_DOMAIN: ${QA_DOMAIN:?QA_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./deploy/qa/Caddyfile:/etc/caddy/Caddyfile:ro
      - prospect-qa-caddy-data:/data
      - prospect-qa-caddy-config:/config

volumes:
  prospect-qa-import-temp:
  prospect-qa-postgresql-data:
  prospect-qa-redis-data:
  prospect-qa-mailpit-data:
  prospect-qa-caddy-data:
  prospect-qa-caddy-config:
