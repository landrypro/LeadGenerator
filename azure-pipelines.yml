trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  nodeVersion: '22.x'
  testDatabaseUrl: 'postgresql+asyncpg://prospect_app:prospect-app-test-only@127.0.0.1:55432/prospect_test'
  testMigrationDatabaseUrl: 'postgresql+asyncpg://prospect_test:prospect-test-only@127.0.0.1:55432/prospect_test'
  testRedisUrl: 'redis://127.0.0.1:56379/0'
  testMailpitApiUrl: 'http://127.0.0.1:58025'
  testMailpitSmtpPort: '51025'
  expectedAlembicRevision: '20260826_0014'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
    displayName: Utiliser Python $(pythonVersion)

  - script: mkdir -p test-results
    displayName: Préparer le répertoire des preuves de qualité

  - script: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements-dev.txt
    displayName: Installer les dépendances Python

  - script: python -m ruff check backend/app tests scripts/quality_gate.py
    displayName: Vérifier le lint Python avec Ruff

  - script: python -m ruff format --check backend/app tests scripts/quality_gate.py
    displayName: Vérifier le formatage Python avec Ruff

  - script: python -m mypy
    displayName: Vérifier les types Python avec mypy

  - script: docker compose -f compose.test.yaml up -d --wait
    displayName: Démarrer PostgreSQL, Redis et Mailpit de test

  - script: docker compose -f compose.test.yaml run --rm database-role-provisioner
    displayName: Provisionner les rôles PostgreSQL de test

  - script: python -m alembic -c backend/alembic.ini upgrade head
    displayName: Appliquer les migrations Alembic
    env:
      MIGRATION_DATABASE_URL: $(testMigrationDatabaseUrl)

  - script: |
      python -m alembic -c backend/alembic.ini downgrade 20260723_0002
      python -m alembic -c backend/alembic.ini upgrade head
    displayName: Vérifier le downgrade et la reconstruction RLS/provisioning/membres
    env:
      MIGRATION_DATABASE_URL: $(testMigrationDatabaseUrl)

  - script: python -m alembic -c backend/alembic.ini check
    displayName: Vérifier la synchronisation des modèles et migrations
    env:
      MIGRATION_DATABASE_URL: $(testMigrationDatabaseUrl)

  - script: |
      python -m alembic -c backend/alembic.ini current > test-results/alembic-current.txt
      python scripts/quality_gate.py alembic-current test-results/alembic-current.txt $(expectedAlembicRevision)
    displayName: Vérifier la révision Alembic courante
    env:
      MIGRATION_DATABASE_URL: $(testMigrationDatabaseUrl)

  - script: pytest --junitxml=test-results/pytest.xml
    displayName: Exécuter les tests Python unitaires et d’intégration
    env:
      TEST_DATABASE_URL: $(testDatabaseUrl)
      TEST_MIGRATION_DATABASE_URL: $(testMigrationDatabaseUrl)
      TEST_REDIS_URL: $(testRedisUrl)
      TEST_MAILPIT_API_URL: $(testMailpitApiUrl)
      TEST_MAILPIT_SMTP_PORT: $(testMailpitSmtpPort)
      REQUIRE_INFRASTRUCTURE_TESTS: 'true'

  - script: python scripts/quality_gate.py junit-no-skips test-results/pytest.xml
    displayName: Refuser tout test Python ignoré

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/pytest.xml
      testRunTitle: Tests Python

  - script: docker compose -f compose.test.yaml down --volumes
    condition: always()
    displayName: Arrêter les dépendances de test

  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: Utiliser Node.js $(nodeVersion)

  - script: npm ci
    workingDirectory: client
    displayName: Restaurer les dépendances React

  - script: npm run lint
    workingDirectory: client
    displayName: Vérifier le frontend avec ESLint

  - script: npm audit --audit-level=high
    workingDirectory: client
    displayName: Vérifier les vulnérabilités npm élevées

  - script: npm run test:ci
    workingDirectory: client
    displayName: Exécuter les tests frontend

  - script: python scripts/quality_gate.py junit-no-skips test-results/vitest.xml
    displayName: Refuser tout test frontend ignoré

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/vitest.xml
      testRunTitle: Tests React

  - script: npm run build
    workingDirectory: client
    displayName: Compiler l’interface React

  - script: python scripts/quality_gate.py browser-sources client/src
    displayName: Vérifier la confidentialité du navigateur

  - script: python scripts/quality_gate.py artifact client/dist
    displayName: Vérifier l’artefact Vite

  - script: git diff --check
    displayName: Vérifier les espaces et conflits de diff

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.SourcesDirectory)/test-results
      artifact: MarketteoQualityEvidence
    displayName: Publier les preuves de qualité

  - task: CopyFiles@2
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: |
        backend/**
        client/dist/**
        docs/**
        scripts/**
        README.md
        .env.example
        !**/__pycache__/**
        !**/*.pyc
        !**/*.pyo
        !**/.pytest_cache/**
        !**/.mypy_cache/**
        !**/.ruff_cache/**
        !**/node_modules/**
        !**/test-results/**
      TargetFolder: $(Build.ArtifactStagingDirectory)/MarketteoCRM
    displayName: Préparer l’artefact Web

  - script: python scripts/quality_gate.py artifact "$(Build.ArtifactStagingDirectory)/MarketteoCRM"
    displayName: Vérifier l’artefact Web final

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/MarketteoCRM
      artifact: MarketteoCRM
    displayName: Publier l’application
