trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  nodeVersion: '22.x'
  testDatabaseUrl: 'postgresql+asyncpg://prospect_test:prospect-test-only@127.0.0.1:55432/prospect_test'
  testRedisUrl: 'redis://127.0.0.1:56379/0'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
    displayName: Utiliser Python $(pythonVersion)

  - script: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements-dev.txt
    displayName: Installer les dépendances Python

  - script: python -m ruff check backend/app tests
    displayName: Vérifier le lint Python avec Ruff

  - script: python -m ruff format --check backend/app tests
    displayName: Vérifier le formatage Python avec Ruff

  - script: python -m mypy
    displayName: Vérifier les types Python avec mypy

  - script: docker compose -f compose.test.yaml up -d --wait
    displayName: Démarrer PostgreSQL et Redis de test

  - script: python -m alembic -c backend/alembic.ini upgrade head
    displayName: Appliquer les migrations Alembic
    env:
      MIGRATION_DATABASE_URL: $(testDatabaseUrl)

  - script: python -m alembic -c backend/alembic.ini check
    displayName: Vérifier la synchronisation des modèles et migrations
    env:
      MIGRATION_DATABASE_URL: $(testDatabaseUrl)

  - script: pytest --junitxml=test-results/pytest.xml
    displayName: Exécuter les tests Python unitaires et d’intégration
    env:
      TEST_DATABASE_URL: $(testDatabaseUrl)
      TEST_REDIS_URL: $(testRedisUrl)
      REQUIRE_INFRASTRUCTURE_TESTS: 'true'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/pytest.xml
      testRunTitle: Tests Python

  - script: docker compose -f compose.test.yaml down --volumes
    condition: always()
    displayName: Arrêter les dépendances de test

  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: Utiliser Node.js $(nodeVersion)

  - script: npm ci
    workingDirectory: client
    displayName: Restaurer les dépendances React

  - script: npm run lint
    workingDirectory: client
    displayName: Vérifier le frontend avec ESLint

  - script: npm run test:ci
    workingDirectory: client
    displayName: Exécuter les tests frontend

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/vitest.xml
      testRunTitle: Tests React

  - script: npm run build
    workingDirectory: client
    displayName: Compiler l’interface React

  - task: CopyFiles@2
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: |
        backend/**
        client/dist/**
        docs/**
        README.md
        .env.example
      TargetFolder: $(Build.ArtifactStagingDirectory)/GoogleMapsLeadGenerator
    displayName: Préparer l’artefact Web

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/GoogleMapsLeadGenerator
      artifact: GoogleMapsLeadGenerator
    displayName: Publier l’application
