name: prospect-crm-test

services:
  postgresql:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: prospect_test
      POSTGRES_USER: prospect_test
      POSTGRES_PASSWORD: prospect-test-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect_test -d prospect_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
