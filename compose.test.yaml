name: prospect-crm-test

services:
  postgresql:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: prospect_test
      POSTGRES_USER: prospect_test
      POSTGRES_PASSWORD: prospect-test-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect_test -d prospect_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  database-role-provisioner:
    image: postgres:17.10-alpine
    profiles: ["database-tools"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRES_DB: prospect_test
      POSTGRES_USER: prospect_test
      POSTGRES_PASSWORD: prospect-test-only
      POSTGRES_APP_USER: prospect_app
      POSTGRES_APP_PASSWORD: prospect-app-test-only
    volumes:
      - ./backend/database/provision-postgres-roles.sh:/provision-postgres-roles.sh:ro
    command: ["sh", "/provision-postgres-roles.sh"]

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.5
    environment:
      MP_MAX_MESSAGES: 100
      MP_DATABASE: /tmp/mailpit.db
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
