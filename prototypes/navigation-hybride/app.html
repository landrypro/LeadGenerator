<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketteo — prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#163e4d;background:#f3f9fb;font:15px/1.5 system-ui}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer;min-height:44px;border:1px solid #bfd8e2;border-radius:10px;padding:9px 14px;color:#12647e;background:white}button:hover{background:#edf7f5}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #126c94;outline-offset:3px}button.primary{background:#096e8d;color:white;border-color:#096e8d}button:disabled{opacity:.55;cursor:default}a{color:#096e8d}.skip{position:absolute;top:-100px}.skip:focus{top:0;background:white;z-index:99;padding:12px}.top{background:white;border-bottom:1px solid #d6e5eb;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:21px;white-space:nowrap;margin-right:8px}.brand span{display:inline-grid;place-items:center;background:linear-gradient(130deg,#b9ec79,#77d7dc);width:38px;height:38px;border-radius:11px;margin-right:8px}.desktop{display:flex;align-items:center;gap:3px;flex:1}.desktop a,.desktop summary{padding:10px 9px;white-space:nowrap;font-size:13px;font-weight:600;text-decoration:none;color:#315567;border-radius:9px;cursor:pointer}.desktop a[aria-current]{background:#e8f5e8;color:#096e8d}.desktop details{position:relative}.desktop details>div{position:absolute;top:42px;left:0;width:252px;background:white;border:1px solid #bfd8e2;box-shadow:0 12px 30px #173d4d22;padding:8px;border-radius:12px}.desktop details a{display:block;white-space:normal}.tools{display:flex;gap:8px;margin-left:auto}.org{max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.compact{display:none}.bottom{display:none}main{max-width:1150px;margin:auto;padding:32px 28px 110px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#537787;font-weight:700}h1{font-size:30px;line-height:1.2;margin:10px 0 12px}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.muted{color:#54717e}.heading{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:24px}.panel{background:white;border:1px solid #d2e2e8;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{font-size:30px;font-weight:700}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-block;border-radius:20px;background:#e9f5e7;color:#326337;font-size:12px;padding:5px 10px}.list article{padding:18px 0;border-bottom:1px solid #e1ebef}.list article:last-child{border:0}.list label{display:flex;gap:14px;align-items:center;font-weight:650;min-height:44px}input[type=checkbox]{width:22px;height:22px}.list details{margin-left:36px}.list summary{cursor:pointer;min-height:44px;padding-top:10px;color:#176f88}.list input[type=text]{max-width:100%}.selection{position:sticky;bottom:78px;background:#163e4d;color:white;padding:14px;border-radius:12px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.selection[hidden]{display:none}dialog{color:#163e4d;border:1px solid #bfd8e2;border-radius:18px;max-height:90vh;width:440px;max-width:calc(100% - 28px);padding:22px;box-shadow:0 24px 80px #142f3b44}dialog::backdrop{background:#102f40a0}dialog h2{margin:0}.dialogHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.navlinks a{display:block;padding:12px 10px;text-decoration:none;border-radius:9px}.navlinks a[aria-current]{background:#e9f5e7;font-weight:700}.navlinks details{border-top:1px solid #dde8ed;margin-top:10px}.navlinks summary{padding:16px 10px;font-weight:700;cursor:pointer}.navlinks details a{padding-left:22px}form label{display:grid;gap:6px;margin:16px 0}input,select{border:1px solid #bfd5df;padding:11px;border-radius:9px;background:white;color:#163e4d;width:100%;min-width:0}form footer{position:sticky;bottom:0;background:white;padding-top:14px;display:flex;gap:10px;justify-content:flex-end}.notice{border-left:3px solid #0e7897;padding:8px 12px;background:#edf7fa}.fakeMap{min-height:220px;display:grid;place-content:center;background:repeating-linear-gradient(35deg,#edf5ee,#edf5ee 30px,#e3eeea 30px,#e3eeea 32px);border-radius:12px;text-align:center;padding:20px}.toast{position:fixed;bottom:85px;left:16px;right:16px;background:#173d4d;color:white;padding:14px 20px;border-radius:12px;z-index:40;box-shadow:0 6px 30px #173d4d33}.toast:empty{display:none}.dataRow{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #e1ebef}.dataRow span:last-child{text-align:right}.routeNote{margin-top:20px;font-size:13px;color:#54717e}
@media(max-width:1399px){.desktop{display:none}.compact{display:inline-block}.brand{font-size:19px}.top{padding:12px 18px}}
@media(max-width:600px){.top{padding:10px 12px;gap:8px;flex-wrap:wrap}.brand{font-size:18px}.brand span{width:30px;height:30px}.tools{gap:6px}.tools .help,.tools .user{display:none}.org{max-width:125px;font-size:12px}.compact{padding:7px 10px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #c8dce5;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:12;justify-content:space-around}.bottom a,.bottom button{font-size:11px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;flex:1;padding:4px 1px;border:0;color:#42616e}.bottom b{font-size:18px}.bottom [aria-current]{color:#096e8d;background:#eaf5ec;border-radius:8px}.menuOnly .bottom{display:none}main{padding:24px 16px 100px}h1{font-size:26px}.grid{grid-template-columns:1fr}.panel{padding:17px}.heading{align-items:flex-start;flex-direction:column}.heading button{width:100%}dialog{max-width:100%;width:100%;height:100%;max-height:100%;margin:0;border-radius:0;padding:20px}dialog .dialogHead{position:sticky;top:-20px;background:white;padding:12px 0;z-index:2}.selection{bottom:80px}.menuOnly .selection{bottom:12px}.dataRow{flex-wrap:wrap}.dataRow span:last-child{text-align:left}.list details{margin-left:0}}
</style></head><body><a class="skip" href="#content">Aller au contenu</a><header class="top"><div class="brand"><span>▦</span>Marketteo</div><button class="compact" id="menuBtn">☰ Menu</button><nav class="desktop" id="desktop" aria-label="Navigation principale"></nav><div class="tools"><button class="org" id="orgBtn">Atelier Boréal ▾</button><button class="help" id="helpBtn">Aide</button><button class="user" id="userBtn">Camille ▾</button></div></header><main id="content" tabindex="-1"></main><nav class="bottom" id="bottom" aria-label="Navigation mobile"></nav><dialog id="modal"><div class="dialogHead"><h2 id="modalTitle"></h2><button id="closeBtn" aria-label="Fermer">✕</button></div><div id="modalBody"></div></dialog><div class="toast" role="status" id="toast"></div>
<script>
const labels={fr:['Tableau de bord','Mes tâches','Prospects','Pipeline','Opportunités','Recherche d’établissements','Sources d’acquisition','Quotas et usage','Conservation et imports','Historique des imports','Exports CSV','Journal d’activité','Organisation','Membres','Compte','Automatisation','Plateforme','Audit plateforme'],en:['Dashboard','My tasks','Prospects','Pipeline','Opportunities','Business search','Acquisition sources','Quotas and usage','Retention and imports','Import history','CSV exports','Activity log','Organization','Members','Account','Automation','Platform','Platform audit']};
const ids=['home','tasks','prospects','pipeline','opportunities','search','sources','usage','retention','imports','exports','audit','organization','members','account','automation','platform','platformAudit'];let settings={role:'admin',lang:'fr',variant:'bottom',automation:'off'},page='home',organization='Atelier Boréal',applied=null,selected=new Set(),added=new Set(),trigger=null,timer;const modal=document.querySelector('#modal'),body=document.querySelector('#modalBody'),content=document.querySelector('#content');const t=(fr,en)=>settings.lang==='fr'?fr:en;const name=id=>labels[settings.lang][ids.indexOf(id)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const companies=[['Atelier Plomberie Nord','Quartier Saint-Roch · 2,4 km'],['Services Boréal','Limoilou · 3,8 km'],['Plomberie des Rives','Sainte-Foy · 6,1 km'],['Équipe Horizon','Zone de service · distance non vérifiable']];
function allowed(id){if(settings.role==='none')return id==='account';if(settings.role==='platform')return ['platform','platformAudit','account'].includes(id);if(['platform','platformAudit'].includes(id))return false;if(id==='automation')return settings.automation==='on';return settings.role==='admin'||!['retention','imports','audit','members'].includes(id)}
function link(id){return `<a href="#${id}" data-page="${id}" ${page===id?'aria-current="page"':''}>${name(id)}</a>`}
function groups(){return [[t('Acquisition','Acquisition'),['search','sources']],[t('Données et audit','Data and audit'),['usage','retention','imports','exports','audit']],[t('Administration','Administration'),['organization','members']]]}
function links(){const direct=['home','automation','tasks','prospects','pipeline','opportunities','platform','platformAudit'].filter(allowed).map(link).join('');return direct+groups().map(([n,items])=>{items=items.filter(allowed);return items.length?`<details><summary>${n}</summary><div>${items.map(link).join('')}</div></details>`:''}).join('')}
function notify(s){document.querySelector('#toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#toast').textContent='',4500)}
function close(){modal.close()}
function open(title,html){if(modal.open)close();trigger=document.activeElement;document.querySelector('#modalTitle').textContent=title;body.innerHTML=html;modal.showModal()}
modal.addEventListener('close',()=>{if(!modal.open&&trigger?.isConnected)trigger.focus()});document.querySelector('#closeBtn').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
function navigation(){document.documentElement.lang=settings.lang;document.body.classList.toggle('menuOnly',settings.variant==='menu'||['platform','none'].includes(settings.role));document.querySelector('#desktop').innerHTML=links();document.querySelector('#menuBtn').textContent='☰ '+t('Menu','Menu');document.querySelector('#helpBtn').textContent=t('Aide','Help');document.querySelector('#orgBtn').textContent=['none','platform'].includes(settings.role)?t('Sans organisation','No organization'):organization+' ▾';document.querySelector('#bottom').innerHTML=['home','tasks','prospects','pipeline'].filter(allowed).map((id,i)=>`<a href="#${id}" data-page="${id}" ${page===id?'aria-current="page"':''}><b aria-hidden="true">${['⌂','✓','♙','▤'][i]}</b>${id==='home'?t('Accueil','Home'):id==='tasks'?t('Tâches','Tasks'):name(id)}</a>`).join('')+`<button data-action="menu"><b aria-hidden="true">☰</b>${t('Plus','More')}</button>`}
function menu(){open(t('Navigation','Navigation'),`<nav class="navlinks">${links()}<hr>${link('account')}<button data-action="org">${t('Changer d’organisation','Switch organization')}</button> <button data-action="help">${t('Aide','Help')}</button><p class="muted">${t('Profil simulé','Simulated profile')} : ${settings.role}</p></nav>`)}
function org(){open(t('Organisation active','Active organization'),`<p>${t('Changer d’espace réinitialise les résultats fictifs.','Switching workspace clears fictional results.')}</p>${['Atelier Boréal','Studio Rivage'].map(n=>`<p><button data-org="${n}">${n}${organization===n?' ✓':''}</button></p>`).join('')}`)}
document.querySelector('#menuBtn').onclick=menu;document.querySelector('#orgBtn').onclick=org;document.querySelector('#helpBtn').onclick=()=>help();document.querySelector('#userBtn').onclick=()=>open(t('Votre compte','Your account'),`<p>Camille · ${settings.role}</p>${link('account')}<p>${t('Session de démonstration uniquement.','Demonstration session only.')}</p>`);
function help(){open(t('Aide au prototype','Prototype help'),`<p>${t('Les menus et la recherche sont interactifs. Les autres pages sont des maquettes de destination. Aucun appel réseau ni enregistrement réel.','Menus and search are interactive. Other pages are destination mockups. No network calls or real records.')}</p>`)}
function header(sub=''){return `<div class="eyebrow">${esc(organization)} / ${t('Espace de travail','Workspace')}</div><div class="heading"><div><h1 tabindex="-1">${name(page)}</h1><p class="muted">${sub}</p></div><span class="pill">${t('Données fictives','Fictional data')}</span></div>`}
function render(){navigation();if(settings.role==='none'){content.innerHTML=`<section class="panel"><h1>${t('Aucune organisation accessible','No accessible organization')}</h1><p>${t('État simulé : la navigation métier est absente.','Simulated state: business navigation is unavailable.')}</p></section>`;return}
if(page==='search'){renderSearch();return}let html=header();if(page==='home'){html+=`<div class="grid">${[[t('À suivre aujourd’hui','Follow up today'),'4','tasks'],[t('Prospects actifs','Active prospects'),'12','prospects'],[t('Opportunités ouvertes','Open opportunities'),'6','opportunities']].map(([n,v,id])=>`<section class="panel"><p>${n}</p><div class="metric">${v}</div>${link(id)}</section>`).join('')}</div><section class="panel"><h2>${t('Votre prochaine action','Your next action')}</h2><p>${t('Préparer le suivi d’Atelier des Pins.','Prepare a follow-up for Pine Workshop.')}</p><button data-page="tasks">${t('Voir mes tâches','View my tasks')}</button></section>`}
else if(page==='usage'){html+=`<section class="panel"><div class="row"><label>${t('Portée','Scope')} <select><option>${t('Mon usage','My usage')}</option>${settings.role==='admin'?`<option>${t('Organisation','Organization')}</option>`:''}</select></label><label>${t('Période','Period')} <select><option>${t('30 derniers jours','Last 30 days')}</option><option>${t('Aujourd’hui','Today')}</option></select></label></div><h2>${t('Quota Text Search','Text Search quota')}</h2><div class="metric">4 / 20</div><p>${t('Réservations techniques simulées — ce rapport n’est pas une facture.','Simulated technical reservations — this report is not an invoice.')}</p><div class="dataRow"><span>Imports CSV</span><strong>2</strong></div><div class="dataRow"><span>Exports CSV</span><strong>3</strong></div></section>`}
else if(page==='exports'){html+=`<section class="panel"><h2>${t('Mes demandes','My requests')}</h2><button class="primary" data-action="export">${t('Préparer un export fictif','Prepare a mock export')}</button><div id="exportsList"><div class="dataRow"><span>Prospects · CSV</span><span>${t('Prêt · téléchargement simulé','Ready · simulated download')} <button data-action="download">${t('Télécharger','Download')}</button></span></div></div><p class="muted">${t('Données CRM internes uniquement. Aucun export de résultats Google.','Internal CRM data only. No export of Google results.')}</p></section>`}
else if(page==='automation'){html+=`<div class="notice">${t('Extension future — maquette uniquement, aucune automatisation active.','Future extension — mockup only, no active automation.')}</div><section class="panel"><h2>${t('Aujourd’hui','Today')}</h2><p>${t('Un prospect fictif attend une prochaine action.','A fictional prospect needs a next action.')}</p><div class="row"><button data-action="future">${t('Boîte d’entrée','Inbox')}</button><button data-action="future">Playbooks</button></div></section>`}
else if(page==='tasks'){html+=`<section class="panel list">${['Atelier des Pins','Maison Rivage','Équipe Boréal'].map((n,i)=>`<article><label><input type="checkbox">${t('Préparer le suivi','Prepare follow-up')} · ${n}</label><p class="muted">${t('Aujourd’hui','Today')} · ${9+i}:30</p></article>`).join('')}</section>`}
else{html+=`<section class="panel"><h2>${t('Aperçu de la destination','Destination preview')}</h2><p>${t('Cette maquette permet de vérifier le classement et l’accès à cette page.','This mockup lets you assess grouping and access to this page.')}</p>${(page==='account'?['Camille',organization]:page==='platform'?['Organisations','Audit plateforme']:['Atelier des Pins','Maison Rivage','Équipe Boréal']).map((n,i)=>`<div class="dataRow"><span>${n}</span><span>${t('Exemple','Example')} ${i+1}</span></div>`).join('')}</section>`}content.innerHTML=html}
function renderSearch(){content.innerHTML=header(t('Trouver et sélectionner les entreprises à prendre en charge.','Find and select businesses to follow up.'))+`<section class="panel"><div class="row between"><div><strong>${applied?esc(applied.query+' · '+applied.city):t('Définir votre zone de recherche','Set your search area')}</strong><p class="muted">${applied?esc(applied.radius)+' km · '+(applied.service?t('Zones de service incluses','Service areas included'):t('Adresses visibles','Visible addresses')):t('Pays, ville et rayon de recherche.','Country, city and search radius.')}</p></div><button class="primary" data-action="params">${applied?t('Modifier','Edit'):t('Définir les paramètres','Set parameters')}</button>${applied?`<button data-action="map">${t('Voir la carte','View map')}</button>`:''}</div></section>`+(applied?`<section class="panel list"><div class="row between"><h2>${t('Établissements','Businesses')} · 4</h2><span class="pill">${t('Recherche simulée','Simulated search')}</span></div><label><input id="all" type="checkbox" ${selected.size===4?'checked':''}>${t('Sélectionner les quatre résultats','Select all four results')}</label>${companies.map(([n,a],i)=>`<article><label><input data-select="${i}" type="checkbox" ${selected.has(i)?'checked':''} ${added.has(i)?'disabled':''}>${n}${added.has(i)?' ✓':''}</label><p class="muted">${a}</p><details><summary>${t('Détails et ajout au CRM','Details and CRM entry')}</summary><p>${t('Ouvert · Plomberie · établissement fictif','Open · Plumbing · fictional business')}</p><label>${t('Nom interne CRM à saisir','Enter internal CRM name')}<input type="text" data-alias="${i}" value="" placeholder="${t('Votre nom interne','Your internal name')}"></label><p class="muted">${t('Le nom externe n’est pas copié automatiquement.','External name is not copied automatically.')}</p></details></article>`).join('')}<p class="routeNote">${t('Jeu de démonstration inventé. Aucune donnée ni carte Google chargée.','Invented demonstration dataset. No Google data or map loaded.')}</p><div class="selection" id="selection" ${selected.size?'':'hidden'}><span id="count">${selected.size} ${t('sélectionné(s)','selected')}</span><button data-action="add">${t('Ajouter au CRM','Add to CRM')}</button></div></section>`:`<section class="panel"><h2>${t('Une recherche, puis vos résultats','One search, then your results')}</h2><p>${t('Les résultats apparaîtront ici. Le prototype ne consomme aucun quota.','Results will appear here. This prototype uses no quota.')}</p></section>`)}
function params(){const a=applied||{query:'plombier',country:'Canada',city:'Québec',radius:'15',service:true};open(t('Paramètres de recherche','Search settings'),`<form id="params"><p class="notice">${t('Brouillon : les résultats actuels restent liés à la dernière recherche.','Draft: current results stay linked to the last search.')}</p><label>${t('Type d’entreprise','Business type')}<input name="query" value="${esc(a.query)}" required></label><label>${t('Pays ou région','Country or region')}<select name="country"><option>Canada</option></select></label><label>${t('Ville ou quartier','City or neighbourhood')}<select name="city"><option ${a.city==='Québec'?'selected':''}>Québec</option><option ${a.city==='Montréal'?'selected':''}>Montréal</option></select></label><label>${t('Rayon (km)','Radius (km)')}<input name="radius" type="number" min="1" max="50" value="${a.radius}" required></label><label style="display:flex;align-items:center"><input name="service" type="checkbox" ${a.service?'checked':''}>${t('Inclure les zones de service','Include service areas')}</label><p>${t('Simulation locale. Annuler ou fermer abandonne le brouillon.','Local simulation. Cancel or close discards the draft.')}</p><footer><button type="button" data-action="cancel">${t('Annuler','Cancel')}</button><button class="primary">${t('Rechercher','Search')}</button></footer></form>`);document.querySelector('#params').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);applied={query:f.get('query'),country:f.get('country'),city:f.get('city'),radius:f.get('radius'),service:f.has('service')};selected.clear();added.clear();close();renderSearch();content.querySelector('h1').focus();notify(t('Recherche simulée terminée : quatre résultats fictifs.','Simulated search complete: four fictional results.'))}}
function navigate(id){if(!allowed(id))return;close();page=id;render();content.querySelector('h1')?.focus();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-page],[data-action],[data-org]');if(!el)return;e.preventDefault();if(el.dataset.page){navigate(el.dataset.page);return}if(el.dataset.org){organization=el.dataset.org;applied=null;selected.clear();added.clear();close();render();notify(t('Organisation changée.','Organization switched.'));return}switch(el.dataset.action){case'menu':menu();break;case'org':org();break;case'help':help();break;case'cancel':close();break;case'params':params();break;case'map':open(t('Aperçu de la zone','Area preview'),`<div class="fakeMap"><h2>${esc(applied.city)} · ${applied.radius} km</h2><p>${t('Emplacement réservé à la carte','Map placeholder')}</p><p>${t('Aucun fond géographique chargé.','No geographic basemap loaded.')}</p></div>`);break;case'export':document.querySelector('#exportsList').insertAdjacentHTML('afterbegin',`<div class="dataRow"><span>Prospects · CSV</span><span>${t('Demande fictive prête','Mock request ready')}</span></div>`);notify(t('Demande simulée, aucun fichier créé.','Simulated request, no file created.'));break;case'download':notify(t('Téléchargement simulé. Aucun fichier réel.','Simulated download. No real file.'));break;case'future':notify(t('Destination future à concevoir.','Future destination to design.'));break;case'add':{const missing=[...selected].find(i=>!document.querySelector(`[data-alias="${i}"]`).value.trim());if(missing!==undefined){const input=document.querySelector(`[data-alias="${missing}"]`);input.closest('details').open=true;input.focus();notify(t('Saisissez un nom interne pour chaque sélection.','Enter an internal name for each selected item.'));return}const count=selected.size;selected.forEach(i=>added.add(i));selected.clear();renderSearch();notify(count+' '+t('ajout(s) simulé(s). Aucun enregistrement réel.','simulated addition(s). No real records.'));break}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-select]')){const i=Number(e.target.dataset.select);e.target.checked?selected.add(i):selected.delete(i)}else if(e.target.id==='all'){selected.clear();if(e.target.checked)companies.forEach((_,i)=>{if(!added.has(i))selected.add(i)});document.querySelectorAll('[data-select]').forEach(x=>x.checked=selected.has(Number(x.dataset.select)))}else return;document.querySelector('#selection').hidden=!selected.size;document.querySelector('#count').textContent=selected.size+' '+t('sélectionné(s)','selected')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.open){document.querySelectorAll('.desktop details[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus()})}});document.addEventListener('click',e=>{document.querySelectorAll('.desktop details[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='settings')return;const next=e.data;if(['role','lang','variant','automation'].every(k=>settings[k]===next[k]))return;const profileChanged=settings.role!==next.role;settings=next;if(!allowed(page))page=settings.role==='platform'?'platform':settings.role==='none'?'account':'home';close();if(profileChanged){applied=null;selected.clear();added.clear()}render()});render();
</script><script src="v2.js"></script></body></html>
