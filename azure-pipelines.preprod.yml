trigger: none
pr: none

parameters:
  - name: releaseGitSha
    type: string
  - name: appVersion
    type: string
    default: "5.1.0"
  - name: deployPreproduction
    type: boolean
    default: false

variables:
  ecrRepository: "marketteo/prospect-crm"

stages:
  - stage: Validate
    displayName: "Valider la release P5.1"
    jobs:
      - job: Quality
        displayName: "Verrou qualité et identité Git"
        pool:
          name: "MarketteoPreproduction"
          demands:
            - docker
            - pwsh
            - awscli
        steps:
          - checkout: self
            fetchDepth: 0
          - pwsh: |
              if ("$(Build.SourceVersion)" -ne "${ parameters.releaseGitSha }}") {
                throw "La SHA demandée doit être exactement la SHA construite par le pipeline."
              }
            displayName: "Vérifier la SHA demandée"
          - pwsh: |
              ./scripts/Test-QualityGateLocal.ps1 -DockerMode windows
            displayName: "Exécuter le verrou qualité"

  - stage: Build
    displayName: "Construire et publier l'image immuable"
    dependsOn: Validate
    jobs:
      - job: PublishImage
        pool:
          name: "MarketteoPreproduction"
          demands:
            - docker
            - awscli
        steps:
          - checkout: self
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $image = "$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com/$(ecrRepository)"
              aws ecr get-login-password --region "$(AWS_REGION)" | docker login --username AWS --password-stdin "$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com"
              docker build --build-arg APP_VERSION="${ parameters.appVersion }}" --build-arg RELEASE_GIT_SHA="${ parameters.releaseGitSha }}" -t "$image:${ parameters.releaseGitSha }}" .
              docker push "$image:${ parameters.releaseGitSha }}"
              $digest = aws ecr describe-images --repository-name "$(ecrRepository)" --image-ids imageTag="${ parameters.releaseGitSha }}" --query 'imageDetails[0].imageDigest' --output text --region "$(AWS_REGION)"
              if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Digest ECR invalide : $digest" }
              $revision = ((python -m alembic -c backend/alembic.ini heads | Select-Object -First 1) -split '\s+')[0]
              if ($revision -notmatch '^[0-9]{8}_[0-9]{4}$') { throw "Révision Alembic invalide : $revision" }
              $immutableImage = "$image@$digest"
              python scripts/preprod_release_manifest.py create --output "$(Build.ArtifactStagingDirectory)/release-manifest.json" --git-sha "${ parameters.releaseGitSha }}" --image "$immutableImage" --image-digest "$digest" --app-version "${ parameters.appVersion }}" --alembic-revision "$revision"
              Copy-Item .env.preprod.example "$(Build.ArtifactStagingDirectory)/.env.preprod.example"
            displayName: "Publier dans ECR et produire le manifeste"
          - publish: "$(Build.ArtifactStagingDirectory)"
            artifact: "preprod-release"
            displayName: "Publier le manifeste de release"

  - stage: DeployPreproduction
    displayName: "Déployer en préproduction"
    dependsOn: Build
    condition: and(succeeded(), eq(${ parameters.deployPreproduction }}, true))
    jobs:
      - deployment: Deploy
        environment: "marketteo-preproduction"
        pool:
          name: "MarketteoPreproduction"
          demands:
            - docker
            - awscli
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: "preprod-release"
                - pwsh: |
                    $ErrorActionPreference = 'Stop'
                    $env:RELEASE_MANIFEST = "$(Pipeline.Workspace)/preprod-release/release-manifest.json"
                    sh ./scripts/preprod-render-env.sh .env.preprod.example .env.preprod
                    sh ./scripts/preprod-backup.sh
                    sh ./scripts/preprod-deploy.sh
                  displayName: "Sauvegarder puis déployer le manifeste validé"
